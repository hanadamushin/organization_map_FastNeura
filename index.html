<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="ログインして共有する組織図。">
<title>組織図</title>
<link rel="stylesheet" href="style.css?v=mono1">
<script src="config.js" defer></script><script src="vendor/supabase-2.57.4.js" defer></script><script src="cloud.js" defer></script><script src="model.js" defer></script><script src="app.js?v=mono1" defer></script>
</head>
<body>
<section id="auth-screen" class="auth-screen"><div class="auth-card"><h1>ログイン</h1><p>共有の組織図を開きます。</p><form id="login-form"><label for="login-email">メールアドレス</label><input id="login-email" type="email" autocomplete="username" required><label for="login-password">パスワード</label><input id="login-password" type="password" autocomplete="current-password" required><button id="login-btn" class="button primary full" type="submit">ログイン</button></form><p id="auth-message" class="auth-message" role="status" aria-live="polite">接続を準備しています…</p><button id="retry-btn" class="button secondary full" hidden>もう一度接続する</button><p class="field-hint">利用できるのは、管理者が登録したメンバーのみです。<br>アカウントの作成・パスワードの再設定は管理者にご依頼ください。</p></div></section>

<main id="app-main" hidden>
<div class="workspace">
<section id="viewport" class="viewport" tabindex="0" aria-label="組織図。大きな図は縦横にスクロールできます。操作はこの下にあります。">
<div id="empty" class="empty"><p>メンバーがまだ登録されていません。</p><p>下へスクロールして登録してください。</p></div>
<div id="chart-space"><div id="chart" class="chart"></div></div>
</section>
<section class="controls" aria-label="組織図の操作">
<div class="controls-top"><button id="new-btn" class="button primary">＋ メンバーを登録</button><button id="view-map-btn" class="button secondary">組織図に戻る ↑</button><div class="zoom-controls"><button id="zoom-out" aria-label="縮小">−</button><span id="zoom-label">100%</span><button id="zoom-in" aria-label="拡大">＋</button><button id="fit-btn">全体表示</button></div></div>
<div id="sync-notice" class="sync-notice" role="status" hidden></div>
<div class="control-grid">
<section class="editor" aria-labelledby="form-heading"><h2 id="form-heading">メンバーを追加</h2><form id="member-form"><label for="role">役職 <span class="required">必須</span></label><input id="role" name="role" maxlength="80" placeholder="例：CEO / エンジニア" required autocomplete="organization-title">
<label for="name">名前 <span class="required">必須</span></label><input id="name" name="name" maxlength="80" placeholder="例：山田 太郎" required autocomplete="name">
<label for="parent">所属先 <span class="optional">任意</span></label><select id="parent" name="parent"><option value="">所属先なし（最上位）</option></select><p class="field-hint">直属の上司・責任者を選んでください。<br>選ばない場合は、組織図の最上位になります。</p>
<p id="form-error" class="error" role="alert"></p><button type="submit" id="submit-btn" class="button primary">＋ メンバーを追加</button><button type="button" id="cancel-btn" class="button secondary full" hidden>編集をキャンセル</button><button type="button" id="delete-btn" class="delete-link" hidden>このメンバーを削除</button></form></section>
<section class="data-controls" aria-label="保存と同期"><h2>データ</h2><p id="root-summary"></p><span id="member-count" hidden></span><p id="save-state">クラウドに共有保存</p><div class="file-actions"><button id="refresh-btn" class="button secondary">最新を取得</button><button id="export-btn" class="button secondary">JSONで保存</button><button id="import-btn" class="button secondary">JSONを読み込む</button><button id="legacy-btn" class="button secondary" hidden>旧データを移行</button><input type="file" id="import-file" accept=".json,application/json" hidden></div></section>
</div>
</section>
</div>
</main>
<footer id="account" hidden><span id="account-email"></span><button id="logout-btn" class="text-button">ログアウト</button></footer>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<dialog id="confirm-dialog"><h2 id="confirm-title"></h2><p id="confirm-text"></p><div class="dialog-actions"><button id="confirm-cancel" class="button secondary">キャンセル</button><button id="confirm-ok" class="button primary">実行する</button></div></dialog>
</body></html>
